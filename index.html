<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Deck</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>

<header class="top">
  <h1>Media Deck</h1>
  <input id="search" type="search" placeholder="Search…" autocomplete="off">
  <select id="folder" title="Folder"></select>
  <div class="chips" id="types">
    <button data-type="" class="on">All</button>
    <button data-type="image">Images</button>
    <button data-type="video">Videos</button>
    <button data-type="pdf">PDFs</button>
  </div>
</header>

<main>
  <div id="empty" hidden>
    <h2>No media yet</h2>
    <p>Upload files into the <code>media</code> folder of your GitHub repository. Sub-folders become groups.</p>
  </div>
  <div id="grid" class="grid"></div>
</main>

<footer id="tray" hidden>
  <div class="tray-row">
    <strong id="count">0 selected</strong>
    <button id="selAll">Select all shown</button>
    <button id="order">Order ▴</button>
    <button id="copyLink">Copy link</button>
    <button id="clear">Clear</button>
    <button id="go" class="primary">▶ Present</button>
  </div>
  <ol id="orderList" hidden></ol>
</footer>

<div id="present" hidden>
  <div id="stage"></div>
  <div id="pbar">
    <span id="pcount"></span>
    <span id="ptitle"></span>
    <span class="sp"></span>
    <button id="pprev" title="Previous (←)">‹</button>
    <button id="pnext" title="Next (→)">›</button>
    <select id="pauto" title="Auto-advance">
      <option value="0">Manual</option>
      <option value="5">5 s</option>
      <option value="10">10 s</option>
      <option value="15">15 s</option>
      <option value="30">30 s</option>
      <option value="60">60 s</option>
    </select>
    <label><input type="checkbox" id="ploop" checked> Loop</label>
    <button id="pfs" title="Fullscreen (F)">⛶</button>
    <button id="pclose" title="Close (Esc)">✕</button>
  </div>
</div>

<div id="toast" hidden></div>
</body>
</html>
